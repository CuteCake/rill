name: Prepare GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG must match the extension version v$version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run build:vscode
      - name: Prepare draft with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          assets=(dist/index.html "releases/rill-${tag#v}.vsix")
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::Release $tag has already been published"
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft --generate-notes
          fi
